# Run the whole platform locally:
#   docker compose up --build        -> UI on http://localhost:8080
#
# Ollama runs on the HOST (models are large and already pulled there):
#   ollama pull qwen3-vl:8b-instruct && ollama pull nomic-embed-text
# The backend reaches it through host.docker.internal.

services:
  db:
    image: pgvector/pgvector:pg16          # self-hosted vector DB (Postgres + pgvector)
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # runs on first start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .                               # Dockerfile in the repo root
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-postgres}         # same database as local runs (.env)
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; Docker Desktop has it already
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: .docker/Dockerfile
    environment:
      BACKEND_API_URL: http://backend:5000   # used by nginx's /api/ proxy
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
