# ==============================================================================
# Standards Compliance: ISO 27001:2022 (A.8.25, A.8.28, A.8.29)
# Maintainers:  Taufiq Permana (taufiq.permana@idstar.co.id)
# Latest Update: 2026-01-29
# ==============================================================================

stages:
  - test # Code quality and security linting (A.8.28)
  - scan # Pre-build vulnerability and secret scanning (A.8.8)
  - build # Secure container image construction (A.8.25)
  - post-build-scan # Final validation of artifacts (A.8.10)
  - deploy # Controlled environment deployment (A.8.29)

# ------------------------------------------------------------------------------
# Global Variables
# ------------------------------------------------------------------------------
variables:
  # Container Registry Configuration
  DOCKER_REGISTRY: 560397894482.dkr.ecr.ap-southeast-3.amazonaws.com
  IMAGE_NAME: kmm-frame-ai

  # Versioning Strategy (A.8.10 - Protection of Logs/Audit)
  IMAGE_TAG_STAGING: ${CI_COMMIT_SHORT_SHA}
  IMAGE_TAG_PRODUCTION: $CI_COMMIT_TAG

  # Path Configurations
  DOCKERFILE_PATH: ./Dockerfile
  INFISICAL_ENV_PATH: /kacamatamoo/frame/kmm-frame-ai

  # Performance Optimization (BuildKit & Caching)
  CACHE_DIR: "$CI_PROJECT_DIR/.cache"
  DOCKER_BUILDKIT: 1

# ------------------------------------------------------------------------------
# Reusable Anchors (Security & Optimization)
# ------------------------------------------------------------------------------

# Authenticate with AWS ECR using IAM roles/secrets
.ecr_login: &ecr_login
  - bash ci/aws-ecr-login.sh

# Caching for improved build performance
.python_cache: &python_cache
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip
  policy: pull-push

# Standardized tool setup for Alpine-based environments
.tools_setup_cmds: &tools_setup_cmds
  - apk add --no-cache aws-cli bash curl wget ca-certificates jq gnupg lsb-release openssh-client sed
  - curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.alpine.sh' | bash
  - apk update && apk add infisical
  - chmod +x ci/*.sh

################################################################################
# STAGE: TEST
# Focus: Static Analysis and Secure Coding Standards (A.8.28)
################################################################################

lint:
  stage: test
  image: python:3.12.12-slim
  cache:
    - *python_cache
  before_script:
    - pip install ruff==0.9.3
  script:
    - ruff check .

trivy-scan-config:
  stage: test
  image:
    name: aquasec/trivy:0.69.2
    entrypoint: [""]
  allow_failure: true
  before_script:
    - apk add --no-cache bash
    - chmod +x ci/*.sh
  script:
    - bash ci/trivy-scan-config.sh
  artifacts:
    when: always
    paths:
      - trivy/
    expire_in: 3 months

################################################################################
# STAGE: BUILD
# Focus: Secure Build Environment and Image Hardening (A.8.25)
################################################################################

build:
  stage: build
  needs:
    - job: lint
      artifacts: true
    - job: gitguardian-scan
      artifacts: true
    - job: trivy-scan-fs
      artifacts: true
    - job: trivy-scan-config
      artifacts: true
  before_script:
    - *tools_setup_cmds
    - *ecr_login
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      variables:
        IMAGE_TAG: ${IMAGE_TAG_STAGING}-pre
        BUILD_TAG: "${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
        INFISICAL_ENVIRONMENT: staging
    - if: "$CI_COMMIT_TAG"
      variables:
        IMAGE_TAG: ${IMAGE_TAG_PRODUCTION}
        BUILD_TAG: "${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
        INFISICAL_ENVIRONMENT: prod

  script:
    - bash ci/infisical.sh
    - bash ci/build-docker-image.sh
  artifacts:
    paths:
      - .env
    expire_in: 1 hour
################################################################################
# STAGE: SCAN
# Focus: Vulnerability Management & Secret Detection (A.8.8)
################################################################################

gitguardian-scan:
  image: gitguardian/ggshield:latest
  stage: scan
  script: ggshield secret scan ci

trivy-scan-fs:
  stage: scan
  image:
    name: aquasec/trivy:0.69.2
    entrypoint: [""]
  allow_failure: false
  before_script:
    - apk add --no-cache bash
    - chmod +x ci/*.sh
  script:
    - bash ci/trivy-scan-fs.sh
  artifacts:
    paths:
      - trivy/
    expire_in: 3 months

################################################################################
# STAGE: POST-BUILD-SCAN
# Focus: Image Scanning before push to registry
################################################################################

trivy-scan-image:
  stage: post-build-scan
  image:
    name: aquasec/trivy:0.69.2
    entrypoint: [""]
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      variables:
        IMAGE_TAG: ${IMAGE_TAG_STAGING}-pre
    - if: "$CI_COMMIT_TAG"
      variables:
        IMAGE_TAG: ${IMAGE_TAG_PRODUCTION}
  allow_failure: false
  before_script:
    - apk add --no-cache bash
    - chmod +x ci/*.sh
  script:
    - bash ci/trivy-scan-docker.sh
  retry: 2
  artifacts:
    paths:
      - trivy/
    expire_in: 3 months

################################################################################
# STAGE: DEPLOY (STAGING)
# Focus: Change Management & Environment Isolation (A.8.29, A.8.31)
################################################################################

deploy:staging:
  stage: deploy
  image: alpine:3.22.2
  needs:
    - job: build
      artifacts: true
    - job: trivy-scan-fs
      artifacts: true
    - job: trivy-scan-image
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      variables:
        IMAGE_TAG: ${IMAGE_TAG_STAGING}-pre
        DOCKER_HOST_SECRET_KEY_base64: $SSH_PRIVATE_KEY_BASE64_STAGING
        DOCKER_HOST: $SSH_HOST_STAGING
        DOCKER_USER: $SSH_USER_STAGING
        DOCKER_COMPOSE_PATH_ENV: staging
        DOCKER_SSH_PORT: ${DOCKER_SSH_PORT:-22}
        INFISICAL_ENVIRONMENT: staging
  before_script:
    - *tools_setup_cmds
  script:
    - bash ci/infisical.sh
    - bash ci/deploy.sh
  artifacts:
    paths:
      - .env
    expire_in: 1 hour
  retry: 2
  environment:
    name: staging
    url: https://$STAGING_URL

################################################################################
# STAGE: DEPLOY (PRODUCTION)
# Focus: Critical Infrastructure Deployment & Auditability (A.8.29)
################################################################################

deploy:production:
  stage: deploy
  image: alpine:3.22.2
  needs:
    - job: build
      artifacts: true
    - job: trivy-scan-fs
      artifacts: true
    - job: trivy-scan-image
      artifacts: true
  rules:
    - if: "$CI_COMMIT_TAG"
      variables:
        IMAGE_TAG: $IMAGE_TAG_PRODUCTION
        DOCKER_HOST_SECRET_KEY_base64: $SSH_PRIVATE_KEY_BASE64_PRODUCTION
        DOCKER_HOST: $SSH_HOST_PRODUCTION
        DOCKER_USER: $SSH_USER_PRODUCTION
        DOCKER_COMPOSE_PATH_ENV: production
        DOCKER_SSH_PORT: ${DOCKER_SSH_PORT:-22}
        INFISICAL_ENVIRONMENT: prod
  before_script:
    - *tools_setup_cmds
  script:
    - bash ci/infisical.sh
    - bash ci/deploy.sh
  artifacts:
    paths:
      - .env
    expire_in: 1 hour
  retry: 2
  environment:
    name: production
    url: https://$PRODUCTION_URL
